server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: booking-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DATASOURCE_USERNAME:booking}
    password: ${DATASOURCE_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:}
  swagger:
    public: ${SWAGGER_PUBLIC:true}
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}
  booking:
    pending-ttl: ${BOOKING_PENDING_TTL:5m}
  clients:
    show-base-url: ${SHOW_SERVICE_URL:http://localhost:8084}
    inventory-base-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
