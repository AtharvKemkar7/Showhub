server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: event-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_db}
    username: ${DATASOURCE_USERNAME:event}
    password: ${DATASOURCE_PASSWORD:event}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.eventplatform.event: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:}
  swagger:
    public: ${SWAGGER_PUBLIC:true}
