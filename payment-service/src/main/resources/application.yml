server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DATASOURCE_USERNAME:payment}
    password: ${DATASOURCE_PASSWORD:payment}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:}
  swagger:
    public: ${SWAGGER_PUBLIC:true}
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
  clients:
    booking-base-url: ${BOOKING_SERVICE_URL:http://localhost:8086}
