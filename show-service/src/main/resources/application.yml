server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: show-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/show_db}
    username: ${DATASOURCE_USERNAME:show}
    password: ${DATASOURCE_PASSWORD:show}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:}
  swagger:
    public: ${SWAGGER_PUBLIC:true}
  clients:
    event-base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
    venue-base-url: ${VENUE_SERVICE_URL:http://localhost:8083}
